name: Supabase 깨우기

# Supabase 무료 프로젝트는 7일 동안 요청이 없으면 일시 중지됩니다.
# 사흘마다 공개용 키로 가벼운 요청을 보내 깨어 있게 합니다. (비밀값 필요 없음)
on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Supabase에 요청 보내기
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" web/config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY:\s*'\K[^']+" web/config.js)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/settings?select=id&limit=1" -H "apikey: $KEY")
          echo "HTTP $code"
          test "$code" = "200"
